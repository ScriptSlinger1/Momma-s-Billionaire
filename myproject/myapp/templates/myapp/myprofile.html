{% extends 'myapp/base.html' %}

{% block title %}
MOMMA'S MILLIONAIRE | MY PROFILE
{% endblock %}

{% block content %}
<style>
    /* Profile Card Specific Styles */
    .profile-card {
        background-color: var(--panel-bg, #0d0d0d);
        border: 1px solid var(--border-color, #1a1a1a);
        border-radius: 16px;
        padding: 40px;
        max-width: 600px;
        margin-top: 30px;
        display: flex;
        align-items: center;
        gap: 30px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .profile-avatar-wrapper {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        /* Gradient ring matching your dashboard avatar */
        background: linear-gradient(45deg, var(--accent-light, #b3ffcc), var(--accent-main, #00ff66));
        padding: 4px;
        flex-shrink: 0;
    }

    .profile-avatar-wrapper img,
    .profile-avatar-placeholder {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        background-color: var(--sidebar-bg, #050505);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted, #8c8c8c);
        font-size: 40px;
    }

    .profile-info {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .profile-username {
        font-size: 28px;
        font-weight: 600;
        color: var(--text-main, #ffffff);
        margin: 0;
        letter-spacing: -0.5px;
    }

    .profile-name {
        font-size: 16px;
        color: var(--text-muted, #8c8c8c);
        margin: 0;
    }

    .profile-badge {
        display: inline-block;
        background: rgba(0, 255, 102, 0.1);
        color: var(--accent-main, #00ff66);
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        margin-top: 10px;
        width: max-content;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* Mimicking your dashboard header */
    .page-header h1 {
        font-size: 24px;
        font-weight: 500;
        letter-spacing: 2px;
        color: var(--text-main, #ffffff);
        margin-bottom: 20px;
    }
</style>

<div class="page-header">
    <h1>MY PROFILE</h1>
</div>

<div class="profile-card">
    <div class="profile-avatar-wrapper">
        {% if user.profile_picture %}
            <img src="{{ user.profile_picture.url }}" alt="{{ user.username }}'s Avatar">
        {% else %}
            <div class="profile-avatar-placeholder">
                <i class="fa-solid fa-user"></i>
            </div>
        {% endif %}
    </div>

    <div class="profile-info">
        <h2 class="profile-username">@{{ user.username }}</h2>
        <p class="profile-name">{{ user.first_name }} {{ user.last_name }}</p>
        <span class="profile-badge">Active Member</span>
    </div>
</div>
{% endblock %}
