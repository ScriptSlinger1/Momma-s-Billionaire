<!DOCTYPE html>
<html lang="ru">

<head>
    <title>MOMMA'S MILLIONAIRE | DASHBOARD</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet">

    <style>

        :root {
            --bg-color: #000000;
            --sidebar-bg: #050505;
            --sidebar-collapsed: 75px;
            --sidebar-expanded: 260px;
            --panel-bg: #0d0d0d;
            --panel-bg-hover: #141c14;
            --text-main: #ffffff;
            --text-muted: #8c8c8c;
            --accent-main: #00ff66;
            --accent-light: #b3ffcc;
            --border-color: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: var(--sidebar-collapsed);
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            z-index: 100;
            overflow: hidden;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 2px 0 12px rgba(0,0,0,0.4);
        }

        .sidebar:hover { width: var(--sidebar-expanded); }

        .logo {
            display: flex;
            align-items: center;
            padding: 0 25px;
            margin-bottom: 30px;
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -1.5px;
            white-space: nowrap;
            overflow: hidden;
        }

        .logo i {
            color: var(--accent-main);
            font-size: 20px;
            flex-shrink: 0;
        }

        .logo-text {
            margin-left: 14px;
            opacity: 0;
            transition: opacity 0.2s 0.1s;
        }

        .sidebar:hover .logo-text { opacity: 1; }
        .logo-text .highlight { color: var(--accent-main); }

        .user-profile {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            margin: 0 8px 20px;
            background-color: var(--panel-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            overflow: hidden;
            white-space: nowrap;
        }
        .avatar {
            width: 40px;       /* control size */
            height: 40px;
            border-radius: 50%;
            overflow: hidden;  /* THIS is what actually makes it crop into a circle */
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* prevents stretching, keeps it clean */
        }

        .user-info {
            margin-left: 12px;
            opacity: 0;
            transition: opacity 0.2s 0.1s;
        }

        .sidebar:hover .user-info { opacity: 1; }
        .user-info h4 { font-size: 14px; font-weight: 500; }

        .user-chevron {
            margin-left: auto;
            font-size: 10px;
            color: var(--text-muted);
            opacity: 0;
            transition: opacity 0.2s 0.1s;
            flex-shrink: 0;
            padding-left: 8px;
        }

        .sidebar:hover .user-chevron { opacity: 1; }

        .nav-menu { list-style: none; flex: 1; }

        .nav-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .nav-item {
            padding: 12px 18px;
            margin: 4px 8px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
        }

        .nav-item i {
            font-size: 15px;
            flex-shrink: 0;
            width: 20px;
            text-align: center;
        }

        .nav-item-text {
            margin-left: 14px;
            opacity: 0;
            transition: opacity 0.2s 0.1s;
        }

        .sidebar:hover .nav-item-text { opacity: 1; }

        .nav-link:hover .nav-item { background-color: var(--panel-bg-hover); color: var(--text-main); }

        .nav-link.active .nav-item {
            background: linear-gradient(90deg, rgba(0,255,102,0.15) 0%, rgba(0,255,102,0) 100%);
            color: var(--text-main);
            border-left: 3px solid var(--accent-main);
            padding-left: 15px;
        }

        .main-content {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
            width: 100%;
            margin-left: var(--sidebar-collapsed);
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 2px;
        }

    </style>
</head>

<body>

<aside class="sidebar">
    <div class="logo">
        <i class="fa-solid fa-chart-pie"></i>
        <span class="logo-text">MOMMA'S<span class="highlight"> M.</span></span>
    </div>

    <div class="user-profile">
        <div class="avatar">
            <a href="{% url 'myapp:about-me'%}"><img src="{{ user.profile_picture.url }}"></a>
        </div>
        <div class="user-info">
            <h4>{{ request.user.username }}</h4>
        </div>
        <i class="fa-solid fa-chevron-down user-chevron"></i>
    </div>

    <nav class="nav-menu">
        <a href="/data" class="nav-link">
            <div class="nav-item"><i class="fa-solid fa-chart-line"></i><span
                    class="nav-item-text">Real world data</span></div>
        </a>
        <a href="/panel" class="nav-link">
            <div class="nav-item"><i class="fa-solid fa-sliders"></i><span class="nav-item-text">Control panel</span>
            </div>
        </a>
        <a href="/expenses" class="nav-link">
            <div class="nav-item"><i class="fa-solid fa-piggy-bank"></i><span class="nav-item-text">Smart savings</span>
            </div>
        </a>
        <a href="/sim" class="nav-link">
            <div class="nav-item"><i class="fa-solid fa-flask"></i><span class="nav-item-text">Simulator</span></div>
        </a>
        <a href="/ai" class="nav-link">
            <div class="nav-item"><i class="fa-solid fa-robot"></i><span class="nav-item-text">AI assistant</span></div>
        </a>
    </nav>

    <div style="margin-top:auto;">
        <a href="/settings" class="nav-link">
            <div class="nav-item"><i class="fa-solid fa-gear"></i><span class="nav-item-text">Setting</span></div>
        </a>
    </div>
</aside>


<main class="main-content">

    <div class="header">
        <h1>DASHBOARD</h1>
    </div>

</main>

</body>
</html>
